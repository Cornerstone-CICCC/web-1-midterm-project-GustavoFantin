<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send a email!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jaro:opsz@6..72&family=Krona+One&family=Mochiy+Pop+P+One&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/9c5a482330.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./styling/email.css  ">
</head>


<body>
    <header>
        <div class="logo">GF</div>
        <nav class="links">

            <a href="index.html">Home</a>

            <a href="#contact">Contact</a>

        </nav>
    </header>


    <main>
        <section class="BigContainer">
            <div class="BigBox">
                <div class="greeter">Email me!</div>
                <div class="nameWrap">
                    <label class="name" for="username">Name:</label>
                    <div class="nameBox">
                        <input type="text" class="nameBorder">
                    </div>
                </div>

                <div class="emailWrap">
                    <label class="email" for="useremail">Email:</label>
                    <div class="emailBox">
                        <input type="text" class="emailBorder">
                    </div>
                </div>


                <div class="messageWrap">
                    <label class="message" for="messageArea">Message:</label>
                    <div class="messageBox">
                        <textarea class="txtBox" type="text" id="TextArea"></textarea>
                    </div>
                    <button class="Botao">Send</button>
                </div>
            </div>
        </section>
    </main>
</body>


</html>
